name: House Hunt — Scrape & Update

on:
  schedule:
    # Every other day at 9 am Eastern (13:00 UTC standard / 14:00 UTC daylight)
    - cron: '0 13 */2 * *'
  workflow_dispatch:   # "Run workflow" button in GitHub Actions UI for on-demand runs
  push:
    branches: [claude/real-estate-scraper-LTwDG]
    paths: ['main.py', 'scrapers/**', 'commute.py', 'config.py']

permissions:
  contents: write   # needed to commit listings data back to the repo

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── Run the scraper ───────────────────────────────────────────────────────
      # Secrets are set in: repo Settings → Secrets and variables → Actions
      - name: Scrape listings & send email
        env:
          SENDER_EMAIL:    ${{ secrets.SENDER_EMAIL }}
          SMTP_HOST:       ${{ secrets.SMTP_HOST }}
          SMTP_PORT:       ${{ secrets.SMTP_PORT }}
          SMTP_USER:       ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD:   ${{ secrets.SMTP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python main.py

      # ── Commit updated data back to the repo ──────────────────────────────────
      # docs/listings.json  → auto-served by GitHub Pages (/docs folder)
      # data/seen_listings.json → deduplication state between runs
      - name: Commit updated listings data
        run: |
          git config user.name  "house-hunt-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/listings.json data/seen_listings.json
          git diff --staged --quiet || (
            git commit -m "chore: listings update $(date -u '+%Y-%m-%d')" &&
            git push
          )
