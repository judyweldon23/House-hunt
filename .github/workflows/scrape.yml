name: House Hunt — Scrape & Update

on:
  schedule:
    # Every other day at 9 am Eastern (13:00 UTC standard / 14:00 UTC daylight)
    - cron: '0 13 */2 * *'
  workflow_dispatch:   # "Run workflow" button in GitHub Actions UI for on-demand runs
  push:
    branches: [claude/real-estate-scraper-LTwDG]
    paths: ['main.py', 'scrapers/**', 'commute.py', 'config.py', '.github/workflows/scrape.yml']

permissions:
  contents: write   # needed to commit listings data back to the repo

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── Verify imports before running ─────────────────────────────────────────
      - name: Verify Python environment
        run: |
          python - <<'EOF'
          import sys, traceback
          print(f"Python {sys.version}")
          checks = [
            ("requests",   "import requests; print('requests', requests.__version__)"),
            ("bs4",        "import bs4; print('bs4', bs4.__version__)"),
            ("pytz",       "import pytz; print('pytz', pytz.__version__)"),
            ("dotenv",     "import dotenv; print('dotenv OK')"),
            ("APScheduler","import apscheduler; print('apscheduler', apscheduler.__version__)"),
            ("flask",      "import flask; print('flask', flask.__version__)"),
            ("main",       "from main import run; print('main import OK')"),
          ]
          ok = True
          for name, code in checks:
            try:
              exec(code)
            except Exception as e:
              print(f"FAIL {name}: {e}")
              traceback.print_exc()
              ok = False
          sys.exit(0 if ok else 1)
          EOF

      # ── Run the scraper ───────────────────────────────────────────────────────
      - name: Scrape listings & send email
        continue-on-error: true   # email failure must not block the data commit
        env:
          SENDER_EMAIL:    ${{ secrets.SENDER_EMAIL }}
          SMTP_HOST:       ${{ secrets.SMTP_HOST }}
          SMTP_PORT:       ${{ secrets.SMTP_PORT }}
          SMTP_USER:       ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD:   ${{ secrets.SMTP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: |
          python -u main.py 2>&1 | tee data/last_run.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo "--- exit code: $EXIT_CODE ---" >> data/last_run.log
          exit $EXIT_CODE

      # ── Commit updated data back to the repo ──────────────────────────────────
      - name: Commit updated listings data
        run: |
          git config user.name  "house-hunt-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/listings.json data/seen_listings.json data/last_run.log
          git diff --staged --quiet || (
            git commit -m "chore: listings update $(date -u '+%Y-%m-%d')" &&
            git push
          )
